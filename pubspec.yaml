name: totoitaliano
description: "TotoItaliano — Il calcio italiano, la tua sfida. Piattaforma di pronostici calcistici."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.6
  firebase_messaging: ^15.1.5
  firebase_storage: ^12.3.7
  firebase_analytics: ^11.3.5

  # Auth providers
  google_sign_in: ^6.2.2

  # Models / immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local storage
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0
  collection: ^1.19.0
  logging: ^1.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

